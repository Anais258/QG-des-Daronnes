<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le QG des Daronnes</title>
    <style>
        :root {
            --bg: #f7f6f4;
            --card-bg: #ffffff;
            --text: #080808;
            --primary: #ff5e3a;
            --border: #dfe4ea;
            --shadow: rgba(0,0,0,0.05);
        }
        [data-theme="dark"] {
            --bg: #1e1e24;
            --card-bg: #2d2d38;
            --text: #f1f2f6;
            --primary: #ff9142;
            --border: #3f3f4e;
            --shadow: rgba(0,0,0,0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            padding-bottom: 84px;
            transition: background 0.3s, color 0.3s;
        }

        /* Écran de Connexion */
        #login-screen {
            max-width: 400px;
            margin: 40px auto;
            text-align: center;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 16px var(--shadow);
        }
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }
        .avatar-card {
            background: var(--bg);
            border: 2px solid var(--border);
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .avatar-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        .avatar-card:hover .avatar-icon {
            animation: avatar-bob 0.6s ease-in-out infinite;
        }

        /* Icône avatar animée (visage qui cligne des yeux + flotte) */
        .avatar-icon {
            width: 48px;
            height: 48px;
            animation: avatar-float 3s ease-in-out infinite;
        }
        .avatar-icon .eye {
            animation: avatar-blink 4s ease-in-out infinite;
            transform-origin: center;
            transform-box: fill-box;
        }
        @keyframes avatar-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        @keyframes avatar-bob {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-3px) rotate(-3deg); }
        }
        @keyframes avatar-blink {
            0%, 88%, 100% { transform: scaleY(1); }
            92% { transform: scaleY(0.1); }
        }

        /* Icône soleil/lune animée pour le bouton thème */
        .theme-icon {
            position: relative;
            width: 18px;
            height: 18px;
            display: inline-block;
            vertical-align: middle;
        }
        .theme-icon svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transition: opacity 0.4s ease, transform 0.5s ease;
        }
        .icon-sun {
            opacity: 1;
            transform: rotate(0deg) scale(1);
            animation: sun-pulse 3s ease-in-out infinite;
        }
        .icon-moon {
            opacity: 0;
            transform: rotate(-90deg) scale(0.6);
        }
        [data-theme="dark"] .icon-sun {
            opacity: 0;
            transform: rotate(90deg) scale(0.6);
            animation: none;
        }
        [data-theme="dark"] .icon-moon {
            opacity: 1;
            transform: rotate(0deg) scale(1);
            animation: moon-twinkle 2.5s ease-in-out infinite;
        }
        @keyframes sun-pulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.25); }
        }
        @keyframes moon-twinkle {
            0%, 100% { filter: drop-shadow(0 0 0px currentColor); }
            50% { filter: drop-shadow(0 0 3px currentColor); }
        }
        #theme-toggle-btn.spin .theme-icon {
            animation: spin-once 0.5s ease;
        }
        @keyframes spin-once {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Application principale */
        #app-screen {
            display: none;
            max-width: 600px;
            margin: 0 auto;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            position: sticky;
            top: 0;
            background: var(--bg);
            padding: 8px 0;
            z-index: 5;
        }
        .top-bar-title {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--primary);
        }
        .top-bar button {
            background: transparent;
            border: none;
            font-size: 1.3rem;
            padding: 4px 8px;
        }
        .top-bar button:hover {
            background: transparent;
            color: var(--primary);
        }

        /* Menu latéral */
        .menu-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 20;
        }
        .menu-overlay.open { display: block; }
        .menu-drawer {
            position: fixed;
            top: 0; left: 0;
            width: 260px;
            max-width: 80vw;
            height: 100%;
            background: var(--card-bg);
            box-shadow: 4px 0 12px var(--shadow);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 21;
            padding: 20px;
            box-sizing: border-box;
        }
        .menu-drawer.open { transform: translateX(0); }
        .menu-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 16px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .menu-header .avatar-icon { width: 36px; height: 36px; margin: 0; }
        .menu-header span { font-weight: bold; }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            padding: 12px 4px;
            font-weight: 600;
            text-decoration: none;
            color: var(--text);
            cursor: pointer;
            box-sizing: border-box;
        }
        .menu-item:hover {
            background: var(--bg);
            color: var(--primary);
            border-radius: 8px;
        }
        .menu-item svg { flex-shrink: 0; }

        /* Barre de navigation du bas */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            border-top: 1px solid var(--border);
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
            z-index: 10;
        }
        .bottom-nav button {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 0.65rem;
            color: var(--text);
            opacity: 0.55;
            padding: 4px 10px;
        }
        .bottom-nav button:hover {
            background: none;
            color: var(--text);
        }
        .bottom-nav button .nav-icon { font-size: 1.3rem; }
        .bottom-nav button svg.nav-icon {
            width: 22px;
            height: 22px;
            display: block;
            margin: 0 auto 2px;
        }
        .bottom-nav button.active-nav {
            opacity: 1;
            color: var(--primary);
        }
        button {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        button.active-view {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* Cartes de soirées */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px var(--shadow);
            border: 1px solid var(--border);
            transition: box-shadow 0.3s, border-color 0.3s;
        }
        .card.highlight-flash {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary);
        }
        .date-header {
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }
        .status-global {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 20px;
            background: #eccc68;
            color: #2f3542;
            font-weight: bold;
        }

        /* Boutons ronds des participantes */
        .participants-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            gap: 8px;
        }
        .participant-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75rem;
        }
        .round-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-top: 4px;
            transition: transform 0.1s, opacity 0.2s;
        }
        .round-btn:active {
            transform: scale(0.9);
        }
        .round-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        .round-btn.saving {
            opacity: 0.5;
        }
        /* Couleurs des états */
        .state-dispo { background: #2ed573; color: white; }
        .state-indispo { background: #ff4757; color: white; }
        .state-bebe { background: #ffa502; color: white; }
        .state-inconnu { background: var(--border); color: var(--text); opacity: 0.7; }

        /* Calendrier mensuel */
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .calendar-nav span {
            font-weight: bold;
            text-transform: capitalize;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .calendar-day-header {
            text-align: center;
            font-size: 0.7rem;
            font-weight: bold;
            color: var(--primary);
            padding-bottom: 4px;
        }
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.8rem;
            position: relative;
            cursor: default;
        }
        .calendar-day.empty {
            border: none;
        }
        .calendar-day.has-event {
            cursor: pointer;
            border-color: var(--primary);
            font-weight: bold;
        }
        .calendar-day.has-event:hover {
            background: var(--primary);
            color: #fff;
        }
        .calendar-day .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-top: 2px;
        }
        #calendar-day-detail {
            margin-top: 16px;
        }

        /* Page d'accueil */
        .home-banner {
            width: 100%;
            height: 150px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--primary), #ffb199);
        }
        .home-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .home-greeting {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 16px;
        }
        .home-greeting .avatar-icon {
            width: 38px;
            height: 38px;
            margin: 0;
            animation: none;
        }
        .overview-label {
            text-transform: uppercase;
            font-size: 0.7rem;
            color: var(--primary);
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .overview-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 4px 0 12px;
        }
        .overview-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }
        .overview-row:last-child { border-bottom: none; }
        .overview-row .day-name { font-weight: bold; }
        .overview-row .day-people { font-size: 0.85rem; opacity: 0.75; margin-top: 2px; }
        .overview-row .chevron { opacity: 0.35; font-size: 1.1rem; }
        .next-available-card {
            text-align: center;
            padding: 18px;
        }
        .next-available-card .label {
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }
        .next-available-card .value {
            font-size: 1.1rem;
            font-weight: bold;
        }
        .whatsapp-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
            margin-top: 4px;
            color: var(--primary);
            font-weight: bold;
            text-decoration: none;
            padding: 10px;
        }
    </style>
</head>
<body data-theme="light">

    <div id="login-screen">
        <h2>🏠 Le QG des Daronnes</h2>
        <p>Qui se connecte aujourd'hui ?</p>
        <div class="avatar-grid" id="avatar-grid"></div>

    <div id="app-screen">
        <div class="top-bar">
            <button onclick="toggleMenu()" title="Menu">☰</button>
            <span class="top-bar-title">🍷 Le QG des Daronnes</span>
            <button id="theme-toggle-btn" onclick="toggleTheme()" title="Mode Sombre">
                <span class="theme-icon">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="12" cy="12" r="4"/>
                        <line x1="12" y1="2" x2="12" y2="4"/>
                        <line x1="12" y1="20" x2="12" y2="22"/>
                        <line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/>
                        <line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/>
                        <line x1="2" y1="12" x2="4" y2="12"/>
                        <line x1="20" y1="12" x2="22" y2="12"/>
                        <line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/>
                        <line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/>
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/>
                    </svg>
                </span>
            </button>
        </div>

        <div id="content-container"></div>
    </div>

    <!-- Menu latéral -->
    <div id="menu-overlay" class="menu-overlay" onclick="closeMenu()"></div>
    <div id="menu-drawer" class="menu-drawer">
        <div class="menu-header">
            <svg id="menu-avatar-icon" class="avatar-icon" viewBox="0 0 48 48"></svg>
            <span id="menu-user-name">Connectée : —</span>
        </div>
        <button class="menu-item" id="menu-refresh-btn" onclick="manualRefresh()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                <path d="M20 12a8 8 0 1 1-2.34-5.66"/>
                <path d="M20 4v5h-5"/>
            </svg>
            <span>Actualiser le planning</span>
        </button>
        <a class="menu-item" id="menu-whatsapp-link" href="#" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            </svg>
            <span>Groupe WhatsApp</span>
        </a>
        <button class="menu-item" onclick="logout()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>Changer de profil</span>
        </button>
    </div>

    <!-- Barre de navigation du bas -->
    <nav class="bottom-nav" id="bottom-nav" style="display:none;">
        <button id="nav-accueil" onclick="switchTab('accueil')">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 11.5 12 4l8 7.5"/>
                <path d="M6 10v9a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-9"/>
            </svg>
            <span>Accueil</span>
        </button>
        <button id="nav-liste" onclick="switchTab('liste')">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="5" cy="6" r="1.2" fill="currentColor" stroke="none"/>
                <line x1="9" y1="6" x2="20" y2="6"/>
                <circle cx="5" cy="12" r="1.2" fill="currentColor" stroke="none"/>
                <line x1="9" y1="12" x2="20" y2="12"/>
                <circle cx="5" cy="18" r="1.2" fill="currentColor" stroke="none"/>
                <line x1="9" y1="18" x2="20" y2="18"/>
            </svg>
            <span>Liste</span>
        </button>
        <button id="nav-idee" onclick="switchTab('idee')">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="4" width="16" height="16" rx="4"/>
                <circle cx="8.5" cy="8.5" r="1.1" fill="currentColor" stroke="none"/>
                <circle cx="15.5" cy="8.5" r="1.1" fill="currentColor" stroke="none"/>
                <circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/>
                <circle cx="8.5" cy="15.5" r="1.1" fill="currentColor" stroke="none"/>
                <circle cx="15.5" cy="15.5" r="1.1" fill="currentColor" stroke="none"/>
            </svg>
            <span>Idée</span>
        </button>
    </nav>

    <script>
        // ==========================================================
        // CONFIGURATION
        // ==========================================================

        // URL de lecture (export CSV public du Google Sheet)
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRiOoyEA46xpeZ9xwlTLiK7SYF8Lpj11-HUGFFHwi7mW9YH8eIqjDmGgyVqmEqz2JIXnYlLnGG6uMxe/pub?gid=0&single=true&output=csv";

        // ⚠️ A REMPLACER : URL du déploiement Apps Script (se termine par /exec)
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzyI9Ecs6VduY3bRyYf4wUuAiid0RD6mPZCcy-K6snSqtrQ6Vlf-1prrB_kKE8Z3ps/exec";

        // 🖼️ Bannière de la page d'accueil : mets ici le chemin/URL de la photo
        // (ex: "images/banniere.jpg" si tu ajoutes le fichier dans ton repo GitHub).
        // Laisse vide "" pour un dégradé de couleur à la place.
        const HOME_BANNER_URL = "https://picsum.photos/200/300";

        // 💬 Lien vers le groupe WhatsApp (menu + page d'accueil)
        const WHATSAPP_URL = "";
        // (protection simple entre vous, pas une vraie sécurité)
        const PEOPLE = [
            { display: "Anaïs",        short: "Anaïs",    key: "anais",       column: "Anais",       pin: "1111", color: "#26de81" },
            { display: "Anne-Sophie",  short: "Anne-So",  key: "anneSophie",  column: "AnneSophie",  pin: "2222", color: "#a55eea" },
            { display: "Céline",       short: "Céline",   key: "celine",      column: "Celine",      pin: "3333", color: "#ff6b81" },
            { display: "Sonia",        short: "Sonia",    key: "sonia",       column: "Sonia",       pin: "4444", color: "#feca57" }
        ];

        // ==========================================================
        // ETAT
        // ==========================================================
        let currentUser = "";
        let currentTab = "accueil"; // 'accueil' | 'liste' | 'idee'
        let currentView = "list";   // sous-vue de l'onglet Liste : 'list' | 'calendar'
        let planningData = [];
        let calYear = new Date().getFullYear();
        let calMonth = new Date().getMonth(); // 0-11

        // ==========================================================
        // LOGIN / LOGOUT
        // ==========================================================
        function buildLoginScreen() {
            const grid = document.getElementById("avatar-grid");
            grid.innerHTML = "";
            PEOPLE.forEach(p => {
                const div = document.createElement("div");
                div.className = "avatar-card";
                div.innerHTML = `
                    <svg class="avatar-icon" viewBox="0 0 48 48">${avatarSvgInner(p)}</svg>
                    <span>${p.display}</span>
                `;
                div.onclick = () => attemptLogin(p);
                grid.appendChild(div);

                // Décalage aléatoire pour que les avatars ne bougent pas tous en même temps
                const delay = (Math.random() * 2).toFixed(2) + "s";
                div.querySelector(".avatar-icon").style.animationDelay = delay;
                div.querySelectorAll(".eye").forEach(eye => eye.style.animationDelay = delay);
            });
        }

        function attemptLogin(person) {
            const pin = prompt(`Code PIN de ${person.display} :`);
            if (pin === null) return; // annulé
            if (pin.trim() === person.pin) {
                login(person.display);
            } else {
                alert("Code PIN incorrect.");
            }
        }

        function login(user) {
            currentUser = user;
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("app-screen").style.display = "block";

            // Remplit le menu latéral avec le nom + l'avatar de la personne connectée
            const person = PEOPLE.find(p => p.display === user);
            document.getElementById("menu-user-name").textContent = `Connectée : ${user}`;
            document.getElementById("menu-avatar-icon").innerHTML = avatarSvgInner(person);

            // Lien WhatsApp : on l'affiche seulement s'il est configuré
            const waLink = document.getElementById("menu-whatsapp-link");
            if (WHATSAPP_URL) {
                waLink.href = WHATSAPP_URL;
                waLink.style.display = "flex";
            } else {
                waLink.style.display = "none";
            }

            currentTab = "accueil";
            document.getElementById("bottom-nav").style.display = "flex";
            switchTab("accueil");
            loadPlanning();
        }

        function logout() {
            currentUser = "";
            closeMenu();
            document.getElementById("bottom-nav").style.display = "none";
            document.getElementById("app-screen").style.display = "none";
            document.getElementById("login-screen").style.display = "block";
        }

        function toggleMenu() {
            document.getElementById("menu-overlay").classList.toggle("open");
            document.getElementById("menu-drawer").classList.toggle("open");
        }

        function closeMenu() {
            document.getElementById("menu-overlay").classList.remove("open");
            document.getElementById("menu-drawer").classList.remove("open");
        }

        // Retourne le contenu interne (sans la balise <svg>) d'un visage avatar,
        // réutilisable pour le login, le menu et la page d'accueil.
        function avatarSvgInner(p) {
            if (!p) return "";
            return `
                <circle cx="24" cy="24" r="20" fill="none" stroke="var(--text)" stroke-width="3"/>
                <path class="eye" d="M14 20 Q17.5 15.5 21 20" fill="none" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
                <path class="eye" d="M27 20 Q30.5 15.5 34 20" fill="none" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="14.5" cy="28" r="4" fill="none" stroke="${p.color}" stroke-width="3"/>
                <circle cx="33.5" cy="28" r="4" fill="none" stroke="${p.color}" stroke-width="3"/>
                <path d="M14.5 30 Q24 38 33.5 30" fill="none" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
            `;
        }

        function toggleTheme() {
            const body = document.body;
            body.setAttribute("data-theme", body.getAttribute("data-theme") === "light" ? "dark" : "light");

            const btn = document.getElementById("theme-toggle-btn");
            btn.classList.remove("spin");
            void btn.offsetWidth; // force le redémarrage de l'animation
            btn.classList.add("spin");
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById("nav-accueil").classList.toggle("active-nav", tab === "accueil");
            document.getElementById("nav-liste").classList.toggle("active-nav", tab === "liste");
            document.getElementById("nav-idee").classList.toggle("active-nav", tab === "idee");
            renderApp();
        }

        function switchView(view) {
            currentView = view;
            renderApp();
        }

        // ==========================================================
        // CHARGEMENT DU PLANNING (lecture via CSV publié)
        // ==========================================================
        function parseCSVLine(line) {
            // Découpe une ligne CSV en respectant les champs entre guillemets
            const result = [];
            let cur = "";
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const c = line[i];
                if (c === '"') {
                    inQuotes = !inQuotes;
                } else if (c === "," && !inQuotes) {
                    result.push(cur);
                    cur = "";
                } else {
                    cur += c;
                }
            }
            result.push(cur);
            return result;
        }

        async function loadPlanning() {
            const container = document.getElementById("content-container");
            if (planningData.length === 0) {
                container.innerHTML = "<p style='text-align:center;'>Chargement du planning...</p>";
            }
            try {
                const response = await fetch(SHEET_CSV_URL + "&t=" + Date.now());
                const data = await response.text();
                const lines = data.split(/\r?\n/).filter(l => l.trim() !== "");

                planningData = [];
                // i = 0 est l'en-tête, la ligne CSV i correspond à la ligne i+1 de la feuille
                for (let i = 1; i < lines.length; i++) {
                    const cols = parseCSVLine(lines[i]);
                    if (cols.length < 7 || !cols[0]) continue;

                    planningData.push({
                        sheetRow: i + 1,
                        date: cols[0].trim(),
                        jour: cols[1].trim(),
                        anais: cols[2].trim(),
                        anneSophie: cols[3].trim(),
                        celine: cols[4].trim(),
                        sonia: cols[5].trim(),
                        analyse: cols[6].trim()
                    });
                }
                renderApp();
            } catch (error) {
                container.innerHTML = "<p style='text-align:center; color:red;'>Erreur de chargement du planning.</p>";
            }
        }

        // ==========================================================
        // RENDU
        // ==========================================================
        function renderApp() {
            const container = document.getElementById("content-container");
            container.innerHTML = "";

            if (currentTab === "accueil") {
                renderHome(container);
            } else if (currentTab === "liste") {
                renderListeTab(container);
            } else if (currentTab === "idee") {
                renderIdee(container);
            }
        }

        // ----- Onglet Accueil -----
        function renderHome(container) {
            const person = PEOPLE.find(p => p.display === currentUser);

            const banner = document.createElement("div");
            banner.className = "home-banner";
            if (HOME_BANNER_URL) {
                banner.innerHTML = `<img src="${HOME_BANNER_URL}" alt="Bannière">`;
            }
            container.appendChild(banner);

            const greeting = document.createElement("div");
            greeting.className = "home-greeting";
            greeting.innerHTML = `
                <svg class="avatar-icon" viewBox="0 0 48 48">${avatarSvgInner(person)}</svg>
                <span>Salut ${currentUser} !</span>
            `;
            container.appendChild(greeting);

            const overviewCard = document.createElement("div");
            overviewCard.className = "card";
            overviewCard.innerHTML = `
                <div class="overview-label">VUE D'ENSEMBLE</div>
                <div class="overview-title">📅 Nos dispos ce week-end</div>
                <div id="overview-rows"></div>
            `;
            container.appendChild(overviewCard);
            renderWeekendOverview(overviewCard.querySelector("#overview-rows"));

            const nextCard = document.createElement("div");
            nextCard.className = "card next-available-card";
            nextCard.innerHTML = renderNextAvailable();
            container.appendChild(nextCard);

            if (WHATSAPP_URL) {
                const waCard = document.createElement("div");
                waCard.className = "card";
                waCard.style.textAlign = "center";
                waCard.innerHTML = `
                    <div class="overview-label">GROUPE WHATSAPP</div>
                    <a class="whatsapp-link" href="${WHATSAPP_URL}" target="_blank" rel="noopener">💬 Ouvrir la discussion</a>
                `;
                container.appendChild(waCard);
            }
        }

        function getUpcomingWeekend() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const day = today.getDay(); // 0=Dim ... 6=Sam
            let fridayOffset;
            if (day === 5) fridayOffset = 0;
            else if (day === 6) fridayOffset = -1;
            else if (day === 0) fridayOffset = -2;
            else fridayOffset = 5 - day;

            const friday = new Date(today);
            friday.setDate(today.getDate() + fridayOffset);
            const saturday = new Date(friday); saturday.setDate(friday.getDate() + 1);
            const sunday = new Date(friday); sunday.setDate(friday.getDate() + 2);

            return [
                { label: "Vendredi", date: friday },
                { label: "Samedi", date: saturday },
                { label: "Dimanche", date: sunday }
            ];
        }

        function renderWeekendOverview(target) {
            const weekend = getUpcomingWeekend();
            target.innerHTML = "";
            weekend.forEach(({ label, date }) => {
                const match = planningData.find(item => {
                    const d = parseDate(item.date);
                    return d && d.getFullYear() === date.getFullYear()
                        && d.getMonth() === date.getMonth()
                        && d.getDate() === date.getDate();
                });
                let names = "Pas encore renseigné";
                if (match) {
                    const dispoNames = PEOPLE.filter(p => (match[p.key] || "").includes("Dispo")).map(p => p.display);
                    names = dispoNames.length ? dispoNames.join(", ") : "Personne de dispo";
                }
                const row = document.createElement("div");
                row.className = "overview-row";
                row.innerHTML = `
                    <div>
                        <div class="day-name">${label}</div>
                        <div class="day-people">Dispo : ${names}</div>
                    </div>
                    <span class="chevron">›</span>
                `;
                row.onclick = () => goToDate(match, label);
                target.appendChild(row);
            });
        }

        function goToDate(match, label) {
            if (!match) {
                alert(`Le ${label} n'est pas encore renseigné dans le planning.`);
                return;
            }
            currentView = "list";
            switchTab("liste");
            requestAnimationFrame(() => {
                const card = document.querySelector(`[data-row="${match.sheetRow}"]`);
                if (card) {
                    card.scrollIntoView({ behavior: "smooth", block: "center" });
                    card.classList.add("highlight-flash");
                    setTimeout(() => card.classList.remove("highlight-flash"), 1500);
                }
            });
        }

        function renderNextAvailable() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const upcoming = planningData
                .map(item => ({ item, d: parseDate(item.date) }))
                .filter(x => x.d && x.d >= today)
                .sort((a, b) => a.d - b.d);

            const found = upcoming.find(x => PEOPLE.every(p => (x.item[p.key] || "").includes("Dispo")));

            if (found) {
                return `
                    <div class="label">🌙 Prochaine soirée où tout le monde est dispo</div>
                    <div class="value">${found.item.jour} ${found.item.date}</div>
                `;
            }
            return `
                <div class="label">😅 Pas encore de date en commun</div>
                <div class="value">Continuez à mettre vos dispos à jour !</div>
            `;
        }

        // ----- Onglet Idée -----
        const IDEAS = [
            "Soirée jeux de société 🎲",
            "Resto entre daronnes 🍕",
            "Apéro chez l'une de vous 🍷",
            "Ciné + pyjama party 🍿",
            "Karaoké improvisé 🎤",
            "Cours de cuisine maison 👩‍🍳",
            "Balade + café 🚶‍♀️☕",
            "Soirée déguisée 🎭",
            "Pique-nique au parc 🧺"
        ];

        function renderIdee(container) {
            const card = document.createElement("div");
            card.className = "card";
            card.style.textAlign = "center";
            card.innerHTML = `
                <div class="overview-title">🎲 Besoin d'inspiration ?</div>
                <p style="opacity:0.75;">Laisse le hasard choisir votre prochaine soirée !</p>
                <div id="idee-result" style="font-size:1.3rem; font-weight:bold; margin:20px 0; min-height:1.6em;">?</div>
                <button onclick="tirerIdee()">🎲 Tirer une idée</button>
            `;
            container.appendChild(card);
        }

        function tirerIdee() {
            const resultEl = document.getElementById("idee-result");
            let count = 0;
            const spin = setInterval(() => {
                resultEl.textContent = IDEAS[Math.floor(Math.random() * IDEAS.length)];
                count++;
                if (count > 10) clearInterval(spin);
            }, 80);
        }

        // ----- Onglet Liste (Vue Liste / Vue Calendrier) -----
        function renderListeTab(container) {
            const controls = document.createElement("div");
            controls.className = "controls";
            controls.innerHTML = `
                <button id="btn-view-list" onclick="switchView('list')">📋 Vue Liste</button>
                <button id="btn-view-calendar" onclick="switchView('calendar')">📅 Vue Calendrier Mensuel</button>
            `;
            container.appendChild(controls);
            controls.querySelector("#btn-view-list").classList.toggle("active-view", currentView === "list");
            controls.querySelector("#btn-view-calendar").classList.toggle("active-view", currentView === "calendar");

            const inner = document.createElement("div");
            inner.id = "planning-inner";
            container.appendChild(inner);

            if (currentView === "list") {
                renderListView(inner);
            } else {
                renderCalendarView(inner);
            }
        }

        function renderListView(container) {
            planningData.forEach((item, index) => {
                container.appendChild(buildCard(item, index));
            });
        }

        async function manualRefresh() {
            const btn = document.getElementById("menu-refresh-btn");
            const label = btn.querySelector("span");
            const original = label.textContent;
            btn.disabled = true;
            label.textContent = "Actualisation...";
            await loadPlanning();
            label.textContent = "Actualisé ✓";
            setTimeout(() => {
                label.textContent = original;
                btn.disabled = false;
                closeMenu();
            }, 1000);
        }

        function getCurrentPersonKey() {
            const person = PEOPLE.find(p => p.display === currentUser);
            return person ? person.key : null;
        }

        function buildCard(item, index) {
            const card = document.createElement("div");
            card.className = "card";
            card.dataset.row = item.sheetRow;
            const myKey = getCurrentPersonKey();
            card.innerHTML = `
                <div class="date-header">
                    <span>🌙 Soirée du ${item.jour} ${item.date}</span>
                    <span class="status-global">${item.analyse}</span>
                </div>
                <div class="participants-row">
                    ${PEOPLE.map(p => {
                        const isMine = p.key === myKey;
                        return `
                        <div class="participant-badge">
                            <span>${p.short}</span>
                            <button class="round-btn ${getStateClass(item[p.key])}"
                                    ${isMine
                                        ? `onclick="changeStatus(${index}, '${p.key}')"`
                                        : `disabled title="Seule ${p.display} peut modifier son statut"`}>
                                ${getShortState(item[p.key])}
                            </button>
                        </div>
                    `;
                    }).join("")}
                </div>
            `;
            return card;
        }

        function getStateClass(state) {
            state = state || "";
            if (state.trim() === "") return "state-inconnu";
            if (state.includes("enfants") || state.includes("👶")) return "state-bebe";
            if (state.includes("Dispo")) return "state-dispo";
            return "state-indispo";
        }

        function getShortState(state) {
            state = state || "";
            if (state.trim() === "") return "?";
            if (state.includes("enfants") || state.includes("👶")) return "👶";
            if (state.includes("Dispo")) return "✓";
            return "✕";
        }

        // ==========================================================
        // CYCLE DE STATUT + ECRITURE REELLE VERS GOOGLE SHEETS
        // Ordre : (pas encore répondu) -> Dispo -> Indispo -> Dispo - enfants -> Dispo
        // ==========================================================
        function nextStatus(current) {
            current = current || "";
            if (current.trim() === "") return "Dispo";
            if (current.includes("enfants")) return "Dispo";
            if (current.includes("Dispo")) return "Indispo";
            return "Dispo - enfants";
        }

        async function changeStatus(index, personKey) {
            if (APPS_SCRIPT_URL.includes("COLLE_ICI")) {
                alert("L'URL de l'Apps Script n'a pas encore été configurée dans le code (APPS_SCRIPT_URL).");
                return;
            }

            const item = planningData[index];
            const person = PEOPLE.find(p => p.key === personKey);
            const oldVal = item[personKey];
            const newVal = nextStatus(oldVal);

            // Mise à jour optimiste de l'affichage
            item[personKey] = newVal;
            renderApp();

            try {
                const url = `${APPS_SCRIPT_URL}?action=updateStatus`
                    + `&row=${item.sheetRow}`
                    + `&personne=${encodeURIComponent(person.column)}`
                    + `&statut=${encodeURIComponent(newVal)}`;
                const resp = await fetch(url);
                const result = await resp.json();

                if (!result.success) {
                    alert("Erreur d'enregistrement : " + (result.error || "inconnue"));
                    item[personKey] = oldVal; // on annule le changement local
                    renderApp();
                }
            } catch (err) {
                alert("Erreur réseau : le statut n'a pas pu être sauvegardé. Nouvelle tentative au prochain chargement.");
                item[personKey] = oldVal;
                renderApp();
            }
        }

        // ==========================================================
        // VUE CALENDRIER MENSUEL (vraie grille)
        // ==========================================================
        function parseDate(str) {
            if (!str) return null;
            str = str.trim();
            let m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (m) return new Date(parseInt(m[3]), parseInt(m[2]) - 1, parseInt(m[1]));
            m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
            if (m) return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
            const d = new Date(str);
            return isNaN(d) ? null : d;
        }

        function renderCalendarView(container) {
            const monthNames = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

            const nav = document.createElement("div");
            nav.className = "card";
            nav.innerHTML = `
                <div class="calendar-nav">
                    <button onclick="changeMonth(-1)">←</button>
                    <span>${monthNames[calMonth]} ${calYear}</span>
                    <button onclick="changeMonth(1)">→</button>
                </div>
                <div class="calendar-grid" id="calendar-grid"></div>
            `;
            container.appendChild(nav);

            const detail = document.createElement("div");
            detail.id = "calendar-day-detail";
            container.appendChild(detail);

            const grid = nav.querySelector("#calendar-grid");
            ["Lu","Ma","Me","Je","Ve","Sa","Di"].forEach(d => {
                const h = document.createElement("div");
                h.className = "calendar-day-header";
                h.textContent = d;
                grid.appendChild(h);
            });

            const firstOfMonth = new Date(calYear, calMonth, 1);
            // Lundi = 0 ... Dimanche = 6
            const startOffset = (firstOfMonth.getDay() + 6) % 7;
            const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

            for (let i = 0; i < startOffset; i++) {
                const empty = document.createElement("div");
                empty.className = "calendar-day empty";
                grid.appendChild(empty);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const cellDate = new Date(calYear, calMonth, day);
                const matchIndex = planningData.findIndex(item => {
                    const d = parseDate(item.date);
                    return d && d.getFullYear() === cellDate.getFullYear()
                        && d.getMonth() === cellDate.getMonth()
                        && d.getDate() === cellDate.getDate();
                });

                const cell = document.createElement("div");
                cell.className = "calendar-day" + (matchIndex !== -1 ? " has-event" : "");
                cell.innerHTML = `<span>${day}</span>`;
                if (matchIndex !== -1) {
                    cell.innerHTML += `<span class="dot" style="background:${dotColorForItem(planningData[matchIndex])}"></span>`;
                    cell.onclick = () => showDayDetail(matchIndex);
                }
                grid.appendChild(cell);
            }
        }

        function dotColorForItem(item) {
            const nbDispo = PEOPLE.filter(p => (item[p.key] || "").includes("Dispo")).length;
            if (nbDispo === PEOPLE.length) return "#2ed573";
            if (nbDispo === 0) return "#ff4757";
            return "#eccc68";
        }

        function showDayDetail(index) {
            const detail = document.getElementById("calendar-day-detail");
            detail.innerHTML = "";
            detail.appendChild(buildCard(planningData[index], index));
        }

        function changeMonth(delta) {
            calMonth += delta;
            if (calMonth < 0) { calMonth = 11; calYear--; }
            if (calMonth > 11) { calMonth = 0; calYear++; }
            renderApp();
        }

        // ==========================================================
        // INITIALISATION
        // ==========================================================
        buildLoginScreen();
    </script>
</body>
</html>
