<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le QG des Daronnes</title>
    <style>
        :root {
            --primary: #ff6b81;
            --secondary: #ff4757;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #2f3542;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
        }
        header {
            text-align: center;
            margin-bottom: 24px;
        }
        h1 {
            color: var(--primary);

            font-size: 1.5rem;
            margin-bottom: 4px;
        }
        p.subtitle {
            font-size: 0.9rem;
            color: #747d8c;
            margin: 0;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .date-header {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-global {
            font-size: 0.85rem;
            padding: 4px 8px;
            border-radius: 20px;
            background: #dfe4ea;
        }
        .participants-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            font-size: 0.85rem;
            margin-top: 10px;
            border-top: 1px solid #f1f2f6;
            padding-top: 10px;
        }
        .participant-item {
            display: flex;
            justify-content: space-between;
        }
        .badge {
            font-weight: 500;
        }
        .badge.Dispo { color: #2ed573; }
        .badge.Indispo { color: #ff4757; }
        .badge.Dispo-\U0001f476 { color: #ffa502; }
    </style>
</head>
<body>
    <header>
        <h1>🏠 Le QG des Daronnes</h1>
        <p class="subtitle">Le planning sans prise de tête</p>
    </header>
    <div id="app">
        <p style="text-align:center;">Chargement du QG...</p>
    </div>
    <script>
        // Colle ton URL CSV récupérée à l'Étape 2 entre les guillemets ci-dessous :
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRiOoyEA46xpeZ9xwlTLiK7SYF8Lpj11-HUGFFHwi7mW9YH8eIqjDmGgyVqmEqz2JIXnYlLnGG6uMxe/pub?gid=0&single=true&output=csv";
        async function loadPlanning() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const data = await response.text();
                const rows = data.split("\n").map(row => row.split(","));
                const appDiv = document.getElementById("app");
                appDiv.innerHTML = "";
                // On saute l'en-tête (i = 1)
                for (let i = 1; i < rows.length; i++) {
                    const cols = rows[i];
                    if (cols.length < 7 || !cols[0]) continue;
                    const date = cols[0].replace(/"/g, '');
                    const jour = cols[1].replace(/"/g, '');
                    const Anaïs = cols[2].replace(/"/g, '');
                    const Anne-Sophie = cols[3].replace(/"/g, '');
                    const Céline = cols[4].replace(/"/g, '');
                    const Sonia = cols[5].replace(/"/g, '');
                    const analyse = cols[6].replace(/"/g, '');
                    const card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML = `
                        <div class="date-header">
                            <span>${jour} ${date}</span>
                            <span class="status-global">${analyse}</span>
                        </div>
                        <div class="participants-grid">
                            <div class="participant-item"><span>Anaïs :</span> <span class="badge ${Anaïs}">${Anaïs}</span></div>
                            <div class="participant-item"><span>Anne-Sophie :</span> <span class="badge ${Anne-Sophie}">${Anne-Sophie}</span></div>
                            <div class="participant-item"><span>Céline :</span> <span class="badge ${Céline}">${Céline}</span></div>
                            <div class="participant-item"><span>Sonia :</span> <span class="badge ${Sonia}">${Sonia}</span></div>
                        </div>
                    `;
                    appDiv.appendChild(card);
                }
            } catch (error) {
                document.getElementById("app").innerHTML = "<p style='text-align:center; color:red;'>Erreur de chargement du planning.</p>";
            }
        }
        loadPlanning();
    </script>
</body>
</html>
